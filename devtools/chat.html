<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>개발용 채팅</title>
  <style>
    :root {
      --bg: #eef1f5; --surface: #ffffff; --line: #e3e7ed; --text: #1c2733; --muted: #64707d;
      --primary: #2459a8; --primary-soft: #e8f0fc; --ok: #1f8a4c; --ok-soft: #e6f6ed;
      --warn: #b7791f; --warn-soft: #fff6df; --bad: #c0392b; --bad-soft: #fdecea;
      --radius: 12px; --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; gap: 12px; padding: 12px; background: var(--bg); color: var(--text);
           font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 14px; line-height: 1.55; }
    button { font: inherit; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: #c9d0d9; border-radius: 8px; }

    /* ---- 왼쪽: 만들고 있는 화면 ---- */
    #preview { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--surface);
               border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    #preview-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    #preview-bar .title { font-weight: 600; }
    #preview-bar .hint-text { margin-left: auto; font-size: 12px; color: var(--muted); }
    #reload { height: 28px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
    #reload:hover { background: var(--bg); }
    #frame { flex: 1; width: 100%; border: 0; background: #fff; }

    /* ---- 오른쪽: 채팅 ---- */
    #chat { width: clamp(400px, 34vw, 540px); display: flex; flex-direction: column; min-width: 0; background: var(--surface);
            border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    header { display: flex; align-items: flex-start; gap: 10px; padding: 16px 18px 14px; background: linear-gradient(135deg, #1f4e8c, #2b6cc4); color: #fff; }
    header .titles { flex: 1; min-width: 0; }
    #fold { height: 28px; padding: 0 10px; border: 1px solid rgba(255, 255, 255, .5); border-radius: 8px; background: rgba(255, 255, 255, .15); color: #fff; font-size: 12.5px; white-space: nowrap; }
    #fold:hover { background: rgba(255, 255, 255, .28); }
    #busy-dot { display: none; width: 10px; height: 10px; margin-top: 9px; border-radius: 50%; background: #ffd166; animation: pulse 1.4s ease-in-out infinite; }
    #chat.working #busy-dot { display: block; }

    /* 접은 상태: 오른쪽에 얇은 띠만 남긴다 */
    #chat.animate { transition: width .18s ease; }  /* 처음 열 때는 애니메이션 없이 바로 자리잡는다 */
    #chat.collapsed { width: 56px; }
    #chat.collapsed > :not(header) { display: none; }
    #chat.collapsed header { flex: 1; flex-direction: column; align-items: center; gap: 14px; padding: 12px 0; }
    #chat.collapsed #fold { order: -1; padding: 0; width: 34px; font-size: 18px; }
    #chat.collapsed header .titles small { display: none; }
    #chat.collapsed header .titles { flex: none; writing-mode: vertical-rl; letter-spacing: .08em; }
    #chat.collapsed #busy-dot { margin-top: 0; }
    header .name { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
    header small { display: block; margin-top: 3px; font-size: 12px; color: rgba(255, 255, 255, .82); }

    /* 단계 표시줄: 번호 원 + 이어지는 선 */
    #stepper { display: flex; padding: 14px 12px 12px; border-bottom: 1px solid var(--line); background: #fafbfc; }
    .chip { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; color: var(--muted); font-size: 12px; }
    .chip:not(:last-child)::after { content: ""; position: absolute; top: 14px; left: calc(50% + 18px); right: calc(-50% + 18px); height: 2px; background: var(--line); }
    .chip.done:not(:last-child)::after { background: var(--ok); }
    .chip .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px;
                 background: var(--surface); border: 2px solid var(--line); color: var(--muted); z-index: 1; }
    .chip .name { font-weight: 700; font-size: 13.5px; color: var(--text); }
    .chip b { font-weight: 600; font-size: 12px; }
    .chip.wait b::after { content: "대기"; }
    .chip.running b::after { content: "진행 중…"; }
    .chip.done b::after { content: "완료"; }
    .chip.failed b::after { content: "문제"; }
    .chip.running .dot { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); animation: pulse 1.4s ease-in-out infinite; }
    .chip.running b { color: var(--warn); }
    .chip.done .dot { border-color: var(--ok); background: var(--ok); color: #fff; font-size: 0; }
    .chip.done .dot::before { content: "✓"; font-size: 15px; }
    .chip.done b { color: var(--ok); }
    .chip.failed .dot { border-color: var(--bad); background: var(--bad); color: #fff; font-size: 0; }
    .chip.failed .dot::before { content: "!"; font-size: 15px; }
    .chip.failed b { color: var(--bad); }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(183, 121, 31, .35); } 50% { box-shadow: 0 0 0 6px rgba(183, 121, 31, 0); } }

    #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 92%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
    .me { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: var(--bg); border-bottom-left-radius: 4px; }
    .tip { align-self: stretch; max-width: 100%; background: var(--primary-soft); color: #1d3f78; border-radius: 10px; font-size: 13px; }
    .ok { align-self: stretch; max-width: 100%; background: var(--ok-soft); color: #14663a; border-radius: 10px; font-weight: 600; }
    .err { align-self: stretch; max-width: 100%; background: var(--bad-soft); color: #962b20; border-radius: 10px; }

    /* 단계 카드 */
    details.card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
    details.card.running { border-left-color: var(--warn); }
    details.card.done { border-left-color: var(--ok); }
    details.card.failed { border-left-color: var(--bad); }
    details.card > summary { display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; font-weight: 600; list-style: none; }
    details.card > summary::-webkit-details-marker { display: none; }
    details.card > summary::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
    details.card.running > summary::before { background: var(--warn); animation: pulse 1.4s ease-in-out infinite; }
    details.card.done > summary::before { background: var(--ok); }
    details.card.failed > summary::before { background: var(--bad); }
    details.card > summary::after { content: "▾"; margin-left: auto; color: var(--muted); }
    details.card:not([open]) > summary::after { content: "▸"; }
    .card-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 3px; }
    .card-body:empty { display: none; }
    details.card > summary:only-child { padding-bottom: 9px; }
    .step { color: var(--muted); font-size: 12.5px; padding-left: 18px; }
    .card-body .result { margin-top: 8px; padding: 10px 12px; background: var(--bg); border-radius: 8px; white-space: pre-wrap; word-break: break-word; font-size: 13px; }

    /* 진행 확인 */
    .gate { align-self: stretch; background: var(--surface); border: 1px solid var(--primary); border-top-width: 4px; border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); }
    .gate .title { font-weight: 700; margin-bottom: 6px; }
    .gate .body { white-space: pre-wrap; word-break: break-word; font-size: 13px; max-height: 240px; overflow-y: auto; padding: 8px 10px; background: var(--bg); border-radius: 8px; }
    .gate .actions { display: flex; gap: 8px; margin-top: 12px; }
    .gate button { height: 34px; padding: 0 20px; border-radius: 8px; border: 1px solid var(--primary); background: var(--primary); color: #fff; font-weight: 600; }
    .gate button.cancel { background: var(--surface); color: var(--text); border-color: var(--line); font-weight: 500; }

    /* 입력 */
    form { display: grid; grid-template-columns: 1fr 84px; grid-template-rows: 1fr 1fr; gap: 6px 8px; padding: 12px 14px 8px; border-top: 1px solid var(--line); }
    textarea { grid-row: 1 / 3; min-width: 0; height: 74px; resize: none; padding: 9px 12px; font: inherit; color: var(--text);
               border: 1px solid var(--line); border-radius: 10px; background: #fff; outline: none; }
    textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    #send { border: 0; border-radius: 10px; background: var(--primary); color: #fff; font-weight: 600; }
    #send:hover:not(:disabled) { filter: brightness(1.1); }
    #stop { border-radius: 10px; border: 1px solid var(--bad); background: #fff; color: var(--bad); font-weight: 600; }
    #stop:hover:not(:disabled) { background: var(--bad-soft); }
    .hint { padding: 2px 16px 12px; font-size: 11.5px; line-height: 1.5; color: var(--muted); }

    @media (max-width: 900px) {
      body { flex-direction: column; } #chat, #chat.collapsed { width: 100%; } #preview { min-height: 40vh; }
      #chat.collapsed header { flex: none; flex-direction: row; padding: 10px 14px; }
      #chat.collapsed header .titles { writing-mode: horizontal-tb; letter-spacing: 0; }
      #chat.collapsed #fold { order: 0; width: auto; padding: 0 10px; font-size: 12.5px; }
    }
  </style>
</head>
<body>
  <section id="preview">
    <div id="preview-bar">
      <span class="title">만들고 있는 화면</span>
      <button type="button" id="reload">새로고침</button>
      <span class="hint-text">보이지 않으면 서버 창이 켜져 있는지 확인하세요</span>
    </div>
    <iframe id="frame" title="만들고 있는 화면"></iframe>
  </section>

  <section id="chat">
    <header>
      <div class="titles">
        <div class="name">개발용 채팅</div>
        <small>내 PC에서만 열립니다 · 배포되지 않습니다</small>
      </div>
      <span id="busy-dot" title="작업 진행 중"></span>
      <button type="button" id="fold" title="채팅 접기">접기 ›</button>
    </header>
    <div id="stepper">
      <div class="chip wait" data-stage="understand"><span class="dot">1</span><span class="name">이해</span><b></b></div>
      <div class="chip wait" data-stage="analyze"><span class="dot">2</span><span class="name">분석</span><b></b></div>
      <div class="chip wait" data-stage="develop"><span class="dot">3</span><span class="name">개발</span><b></b></div>
      <div class="chip wait" data-stage="review"><span class="dot">4</span><span class="name">검토</span><b></b></div>
    </div>
    <div id="log">
      <div class="msg tip">만들거나 고치고 싶은 내용을 적어 주세요. 이해 → 분석 → 개발 → 검토 순서로 진행되고, 지금 어느 단계인지 위에 표시됩니다. 이해가 끝나면 이해한 내용을 보여 드리고, 진행할지 물어봅니다.</div>
    </div>
    <form id="form">
      <textarea id="input" maxlength="4000" placeholder="예: 애플 화면에 연도별 매출 막대그래프를 추가해 줘"></textarea>
      <button type="submit" id="send">보내기</button>
      <button type="button" id="stop" disabled>중지</button>
    </form>
    <div class="hint">개인정보·비밀번호·키는 입력하지 마세요. Enter 로 보내고, Shift+Enter 로 줄을 바꿉니다. 한 번에 한 작업만 진행되며, 이전 대화는 기억하지 않습니다.</div>
  </section>

  <script>
    // 모든 글은 textContent 로만 넣는다. (HTML 로 해석하지 않아 안전하다)
    var log = document.getElementById("log");
    var form = document.getElementById("form");
    var input = document.getElementById("input");
    var send = document.getElementById("send");
    var stopBtn = document.getElementById("stop");
    var frame = document.getElementById("frame");
    var chatBox = document.getElementById("chat");
    var fold = document.getElementById("fold");

    // 채팅 접기/펼치기. 접어도 작업은 계속 진행되고, 위쪽 노란 점이 깜빡여서 알려 준다.
    function setFolded(folded) {
      chatBox.classList.toggle("collapsed", folded);
      fold.textContent = folded ? "‹" : "접기 ›";
      fold.title = folded ? "채팅 펼치기" : "채팅 접기";
      if (!folded) log.scrollTop = log.scrollHeight;
      try { localStorage.setItem("devchat-folded", folded ? "1" : "0"); } catch (e) {}
    }
    fold.addEventListener("click", function () { setFolded(!chatBox.classList.contains("collapsed")); });
    try { if (localStorage.getItem("devchat-folded") === "1") setFolded(true); } catch (e) {}
    setTimeout(function () { chatBox.classList.add("animate"); }, 100);
    var chips = {};
    document.querySelectorAll(".chip").forEach(function (c) { chips[c.dataset.stage] = c; });
    var cards = {};  // 단계별로 가장 최근 카드

    // 만들고 있는 화면(앱)은 같은 PC 의 8000번 주소다.
    var appUrl = "http://" + location.hostname + ":8000/";
    frame.src = appUrl;
    // 미리보기가 어느 화면(예: /papers)을 보고 있는지 기억해서, 새로고침해도 그 화면으로 돌아오게 한다.
    var currentPath = "/";
    window.addEventListener("message", function (event) {
      var data = event.data;
      if (event.origin !== appUrl.slice(0, -1) || !data || data.type !== "preview-path") return;
      if (typeof data.path === "string" && data.path.charAt(0) === "/") currentPath = data.path;
    });
    function reloadFrame() { frame.src = appUrl.slice(0, -1) + currentPath; }
    document.getElementById("reload").addEventListener("click", reloadFrame);

    function el(tag, cls, text) {
      var node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function add(cls, text) {
      var div = el("div", "msg " + cls, text);
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }
    function setBusy(busy) {
      send.disabled = busy; stopBtn.disabled = !busy;
      chatBox.classList.toggle("working", busy);
    }
    function resetChips() {
      Object.keys(chips).forEach(function (k) { chips[k].className = "chip wait"; });
    }

    function onStage(item) {
      var chip = chips[item.stage];
      if (chip) chip.className = "chip " + item.status;
      var title = item.label + (item.round > 1 ? " (다시 " + item.round + "번째)" : "");
      if (item.status === "running") {
        var card = el("details", "card running");
        card.open = true;
        card.appendChild(el("summary", "", title));
        var body = el("div", "card-body");
        card.appendChild(body);
        log.appendChild(card);
        cards[item.stage] = { card: card, body: body, title: title };
      } else if (cards[item.stage]) {
        var c = cards[item.stage];
        c.card.className = "card " + item.status;
        c.card.firstChild.textContent = c.title;
        if (item.status === "done") c.card.open = false;  // 끝난 단계는 접어 둔다
      }
      log.scrollTop = log.scrollHeight;
    }

    function onGate(item) {
      setFolded(false);  // 사용자의 확인이 필요하니 접혀 있으면 펼친다
      var box = el("div", "gate");
      box.appendChild(el("div", "title", "이렇게 이해했어요. 진행할까요?"));
      box.appendChild(el("div", "body", item.text));
      var actions = el("div", "actions");
      var go = el("button", "", "진행");
      var cancel = el("button", "cancel", "취소");
      actions.appendChild(go);
      actions.appendChild(cancel);
      box.appendChild(actions);
      log.appendChild(box);
      log.scrollTop = log.scrollHeight;

      function lock(label) {
        go.disabled = true; cancel.disabled = true;
        actions.textContent = label;
      }
      go.addEventListener("click", function () {
        lock("진행합니다.");
        run("/continue", { message: lastMessage, understanding: item.text });
      });
      cancel.addEventListener("click", function () {
        lock("취소했습니다. 내용을 고쳐서 다시 보내 주세요.");
        resetChips();
      });
    }

    function handle(item) {
      if (item.kind === "stage") onStage(item);
      else if (item.kind === "step") {
        var c = cards[item.stage];
        if (c) { c.body.appendChild(el("div", "step", "· " + item.text)); log.scrollTop = log.scrollHeight; }
      } else if (item.kind === "summary") {
        var s = cards[item.stage];
        if (s) s.body.appendChild(el("div", "result", item.text));
      } else if (item.kind === "gate") onGate(item);
      else if (item.kind === "done") {
        add(item.error ? "err" : "ok", item.text);
        if (item.error) setFolded(false);
        // 다른 곳에서 돌고 있는 작업 때문에 막힌 경우에도 '중지' 로 멈출 수 있게 한다.
        lastBusy = !!item.busy;
        if (item.busy) stopBtn.disabled = false;
      }
    }

    function run(url, payload) {
      lastBusy = false;
      setBusy(true);
      return fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      })
        .then(function (res) {
          if (!res.ok) throw new Error("bad");
          var reader = res.body.getReader();
          var decoder = new TextDecoder();
          var buffer = "";
          function pump() {
            return reader.read().then(function (r) {
              if (r.done) return;
              buffer += decoder.decode(r.value, { stream: true });
              var parts = buffer.split("\n\n");
              buffer = parts.pop();
              parts.forEach(function (part) {
                if (part.indexOf("data: ") === 0) {
                  try { handle(JSON.parse(part.slice(6))); } catch (e) {}
                }
              });
              return pump();
            });
          }
          return pump();
        })
        .catch(function () {
          add("err", "연결에 문제가 생겼습니다. 화면을 새로고침한 뒤 다시 시도해 주세요.");
        })
        .finally(function () {
          reloadFrame();  // 끝나면 바뀐 화면을 바로 보여 준다
          var keepStop = !stopBtn.disabled && lastBusy;
          setBusy(false);
          if (keepStop) stopBtn.disabled = false;
          input.focus();
        });
    }

    var lastMessage = "";
    var lastBusy = false;

    // Enter 로 보내고, Shift+Enter 는 줄바꿈. 한글을 쓰는 도중(조합 중)의 Enter 는 무시한다.
    input.addEventListener("keydown", function (event) {
      if (event.key !== "Enter" || event.shiftKey || event.isComposing || event.keyCode === 229) return;
      event.preventDefault();
      if (!send.disabled) form.requestSubmit();
    });

    stopBtn.addEventListener("click", function () { fetch("/stop", { method: "POST" }); });

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      var message = input.value.trim();
      if (!message) return;
      lastMessage = message;
      add("me", message);
      input.value = "";
      resetChips();
      cards = {};
      run("/chat", { message: message });
    });

    // 서버가 예전 버전이면 단계 표시가 오지 않는다. 그 경우 바로 알려 준다.
    fetch("/version")
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        if (!data || data.version < 2) {
          add("err", "서버가 예전 버전이라 단계 표시가 나오지 않습니다. 검은 창을 모두 닫고 '개발용 채팅.bat'을 다시 실행해 주세요.");
          send.disabled = true;
        }
      })
      .catch(function () {});
  </script>
</body>
</html>
