[alembic]
script_location = alembic
# Do not put the DB URL here. alembic/env.py reads DATABASE_URL from app/core/config.py.
# Keep this file ASCII-only (Korean text breaks reading on Korean Windows).

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
